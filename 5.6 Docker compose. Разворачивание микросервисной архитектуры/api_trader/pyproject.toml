[project]
name = "api_trader"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "mypy",
    "pandas>=2.3.2",
    "prometheus-client>=0.23.1",
    "pydantic",
    "pydantic-settings",
    "ruff",
    "t-tech-investments",
    "uvicorn",
]

# https://www.tbank.ru/invest/social/profile/T_InvestAPI/f1923306-7574-4360-9757-6b3a0013318c/?author=profile
# Временно отключаем репозиторий Т-Банка - будем качать библиотеку из зеркала на GitHub
#[[tool.uv.index]]
#name = "tbank"
#url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
#
#[tool.uv]
#allow-insecure-host = ["opensource.tbank.ru"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
exclude = 'venv|.venv|build|dist'

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
exclude = [
    "*.ipynb",
    "*.bzr",
    "*.direnv",
    "*.eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201", "BLE001", "F821", "PERF", "INP001", "A001", "PLW2901", "G", "E501", "PTH", "TRY",
    "ARG", "C", "ERA", "PLR", "DTZ", "S", "RUF", "PERF203", "ANN", "TRY401", "EM", "D205",
    "FBT", "TRY003", "D1", "D203", "D213", "G004", "FA", "COM812", "ISC001", "RUF001"
]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = []
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311"]

[tool.uv.sources]
chronos-forecasting = { git = "https://github.com/amazon-science/chronos-forecasting.git" }
# Добавляем библиотеку напрямую из зеркала с GitHub
# Когда заработает репозиторий Т-Банка строчку ниже можно удалить
t-tech-investments = { git = "https://github.com/Invest-SDK/invest-python.git" }